name: Zapret2 checks
on:
  push:
    branches:
      - feature/zapret2
  pull_request:
  workflow_dispatch:

jobs:
  python-and-installer-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q src/Backend src/utils.py src/_data.py src/zapret2_component.py
      - name: Offline installer tests
        run: python -m unittest discover -s tests -p 'test_zapret2_component.py' -v
      - name: Verify QML manifest
        run: |
          python -c "import pathlib,xml.etree.ElementTree as X; f=pathlib.Path('src'); root=X.parse(f/'resource.qrc').getroot(); assert all((f/n.text).exists() for n in root.iter('file'))"
      - name: Compile Qt resources (new Zapret2 QML must be bundled)
        run: |
          python -m pip install "PySide6>=6.8,<6.12"
          python update-resource.py
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'src'); import resource_rc; from PySide6.QtCore import QFile; p=':/qt/qml/GoodbyeDPI_UI/res/qml/page/T_Zapret2Settings.qml'; f=QFile(p); assert f.exists(),p; assert f.open(QFile.ReadOnly); assert bytes(f.readAll().data()) == Path('src/res/qml/page/T_Zapret2Settings.qml').read_bytes()"
      - name: Windows GitHub bundle integration test
        if: runner.os == 'Windows'
        run: python tests/test_zapret2_real_bundle.py
